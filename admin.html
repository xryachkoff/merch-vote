<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Мерч: результаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Мерч · <span>админка</span></div>
    <div class="user" id="user" hidden><a href="#" id="logout">выйти</a></div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Результаты голосования</h1>
    <p><a href="index.html">← к голосованию</a></p>
    <div class="banner" id="banner" hidden></div>
  </section>

  <form class="panel login" id="login" hidden>
    <h2>Вход в админку</h2>
    <div class="toolbar">
      <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required>
      <button class="btn" type="submit">Войти</button>
    </div>
  </form>

  <div id="content" hidden>
    <div class="stats" id="stats"></div>

    <section class="panel">
      <div class="toolbar">
        <span class="switch">Статус: <span class="pill" id="status"></span></span>
        <button class="btn btn-sm" id="toggle"></button>
        <button class="btn btn-sm btn-ghost" id="reload">Обновить</button>
        <button class="btn btn-sm btn-ghost" id="csv">Скачать CSV</button>
      </div>
    </section>

    <section class="panel">
      <h2>Рейтинг</h2>
      <div id="rank"></div>
    </section>

    <section class="panel">
      <h2>Кто за что голосовал</h2>
      <div class="tbl-wrap"><table class="tbl" id="voters"></table></div>
    </section>

    <section class="panel">
      <h2>Комментарии</h2>
      <div id="comments"></div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="config.js?v=3"></script>
<script src="app.js?v=3"></script>
<script>
const $ = id => document.getElementById(id);
let variants = [], data = null, password = null;
const PW_KEY = 'mv_admin_pw';
function pwGet() { try { return sessionStorage.getItem(PW_KEY); } catch (e) { return null; } }
function pwSet(v) { try { v ? sessionStorage.setItem(PW_KEY, v) : sessionStorage.removeItem(PW_KEY); } catch (e) {} }

function banner(text) { $('banner').hidden = !text; $('banner').textContent = text || ''; $('banner').classList.add('warn'); }
function normName(n) { return String(n || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim(); }
function fmt(d) { return d ? new Date(d).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''; }

function render() {
  const byId = Object.fromEntries(variants.map(v => [v.id, v]));
  const max = Math.max(1, ...Object.values(data.tally));
  const total = data.votes.length;

  $('stats').innerHTML = [
    [data.voters, 'проголосовали'],
    [total, 'голосов всего'],
    [data.comments.length, 'комментариев'],
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

  $('status').className = 'pill ' + (data.open ? 'open' : 'closed');
  $('status').textContent = data.open ? 'открыто' : 'закрыто';
  $('toggle').textContent = data.open ? 'Закрыть голосование' : 'Открыть снова';

  const ranked = variants.map(v => ({ v, n: data.tally[v.id] || 0 })).sort((a, b) => b.n - a.n || a.v.id - b.v.id);
  $('rank').innerHTML = ranked.map(({ v, n }, i) => {
    const who = data.votes.filter(x => x.variant === v.id).map(x => MV.esc(x.name)).join(', ');
    const pct = total ? Math.round(n / data.voters * 100) : 0;
    return `<div class="rank">
      <img src="${v.image}" alt="">
      <div>
        <div class="t"><span>${i + 1}. №${v.id} ${MV.esc(v.title)}</span><span>${n} <small>${data.voters ? '· ' + pct + '% голосовавших' : ''}</small></span></div>
        <div class="bar"><i style="width:${n / max * 100}%"></i></div>
        ${who ? `<div class="who">${who}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  // один человек = один браузер (voter_id); одинаковые имена с разных устройств подсвечиваем
  const people = {};
  data.votes.forEach(x => {
    const p = people[x.voter] || (people[x.voter] = { name: x.name, voter: x.voter, ids: [], at: x.at });
    p.ids.push(x.variant);
    if (x.at > p.at) p.at = x.at;
  });
  const plist = Object.values(people).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ru') || String(a.at).localeCompare(String(b.at)));
  const nameCount = {};
  plist.forEach(p => { const k = normName(p.name); nameCount[k] = (nameCount[k] || 0) + 1; });
  $('voters').innerHTML = plist.length
    ? `<thead><tr><th>Кто</th><th>Голоса</th><th>Когда</th></tr></thead><tbody>` + plist.map(p => `<tr>
        <td><b>${MV.esc(p.name)}</b>${nameCount[normName(p.name)] > 1 ? ' <span class="pill closed" title="Это имя голосовало с нескольких устройств или браузеров">дубль?</span>' : ''}<div class="who">устройство ${MV.esc(String(p.voter).slice(0, 8))}</div></td>
        <td>${p.ids.sort((a, b) => a - b).map(id => `<span class="chip"><img src="${byId[id].image}" alt="">№${id} ${MV.esc(byId[id].title)}</span>`).join('')}</td>
        <td class="who">${fmt(p.at)}</td>
      </tr>`).join('') + '</tbody>'
    : '<tbody><tr><td class="who">Пока никто не голосовал.</td></tr></tbody>';

  const groups = variants.map(v => ({ v, list: data.comments.filter(c => c.variant === v.id) })).filter(g => g.list.length);
  $('comments').innerHTML = groups.length ? groups.map(({ v, list }) => `
    <div class="cgroup">
      <h3>№${v.id} ${MV.esc(v.title)} · ${list.length}</h3>
      ${list.map(c => `<div class="comment"><div class="meta">${MV.esc(c.name)} · ${fmt(c.at)}</div><p>${MV.esc(c.text)}</p></div>`).join('')}
    </div>`).join('') : '<p class="who">Комментариев пока нет.</p>';
}

async function load() {
  try {
    data = await MV.adminApi('admin_results', {}, password);
    pwSet(password);
    banner('');
    $('login').hidden = true;
    $('user').hidden = false;
    $('content').hidden = false;
    render();
  } catch (e) {
    $('content').hidden = true;
    $('user').hidden = true;
    $('login').hidden = false;
    pwSet(null);
    banner(MV.errorText(e));
  }
}

function csv() {
  const byId = Object.fromEntries(variants.map(v => [v.id, v.title]));
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const rows = [['type', 'name', 'voter_id', 'variant_id', 'variant', 'text', 'at']];
  data.votes.forEach(v => rows.push(['vote', v.name, v.voter, v.variant, byId[v.variant], '', v.at]));
  data.comments.forEach(c => rows.push(['comment', c.name, c.voter, c.variant, byId[c.variant], c.text, c.at]));
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'merch-vote.csv';
  a.click();
}

$('toggle').onclick = async () => {
  const open = !data.open;
  if (!open && !confirm('Закрыть голосование? Голоса и комментарии больше нельзя будет менять.')) return;
  try {
    await MV.adminApi('admin_set_open', { open }, password);
    MV.toast(open ? 'Голосование открыто' : 'Голосование закрыто');
    load();
  } catch (e) { MV.toast(MV.errorText(e)); }
};
$('reload').onclick = load;
$('csv').onclick = csv;

(async function init() {
  variants = await MV.loadVariants();
  $('logout').onclick = e => { e.preventDefault(); pwSet(null); location.reload(); };
  $('login').onsubmit = e => {
    e.preventDefault();
    password = $('pw').value;
    load();
  };
  password = pwGet();
  if (password) load(); else $('login').hidden = false;
})();
</script>
</body>
</html>
